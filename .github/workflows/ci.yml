name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build-test-pack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ./ModelContextProtocol.slnx

      - name: Build
        run: dotnet build ./ModelContextProtocol.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test ./ModelContextProtocol.slnx --configuration Release --no-build

      - name: Pack
        run: dotnet pack ./src/McpEndpointExtensions.csproj --configuration Release --no-build --output ./artifacts

      - name: Upload NuGet artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error
