name: Publish NuGet

on:
  schedule:
    - cron: "0 1 * * 1"
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version matching the MCP dependency; leave empty to check for updates"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: nuget-publish
  cancel-in-progress: false

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_publish: ${{ steps.version.outputs.should_publish }}
      update_required: ${{ steps.version.outputs.update_required }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine package version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            export REQUESTED_VERSION="${GITHUB_REF_NAME#v}"
          else
            export REQUESTED_VERSION="${INPUT_VERSION}"
          fi
          python3 .github/scripts/sync_mcp_version.py

  prepare:
    needs: check-version
    if: github.ref_type == 'branch' && (needs.check-version.outputs.should_publish == 'true' || needs.check-version.outputs.update_required == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    env:
      PACKAGE_VERSION: ${{ needs.check-version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Require default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "${GITHUB_REF_NAME}" != "${DEFAULT_BRANCH}" ]]; then
            echo "::error::Automatic updates must run on the default branch."
            exit 1
          fi

      - name: Update MCP dependency and package version
        if: needs.check-version.outputs.update_required == 'true'
        run: python3 .github/scripts/sync_mcp_version.py --apply-version "${PACKAGE_VERSION}"

      - name: Restore
        run: dotnet restore ./ModelContextProtocol.slnx

      - name: Build
        run: dotnet build ./ModelContextProtocol.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test ./ModelContextProtocol.slnx --configuration Release --no-build --no-restore

      - name: Pack
        run: |
          dotnet pack ./src/McpEndpointExtensions.csproj \
            --configuration Release \
            --no-build \
            --output ./artifacts

      - name: Persist validated version update
        if: needs.check-version.outputs.update_required == 'true'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/McpEndpointExtensions.csproj
          git commit -m "chore: update ModelContextProtocol.AspNetCore to ${PACKAGE_VERSION}" \
            -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
          git push origin "HEAD:${DEFAULT_BRANCH}"

      - name: Create release tag and dispatch publishing
        if: needs.check-version.outputs.should_publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="v${PACKAGE_VERSION}"
          REMOTE_SHA="$(git ls-remote --refs origin "refs/tags/${TAG}" | cut -f1)"
          if [[ -n "${REMOTE_SHA}" ]]; then
            git fetch --no-tags origin "refs/tags/${TAG}:refs/tags/${TAG}"
            if ! git merge-base --is-ancestor "${TAG}^{commit}" HEAD; then
              echo "::error::Existing tag ${TAG} is not an ancestor of the validated commit; resolve it manually."
              exit 1
            fi
            git show "${TAG}:src/McpEndpointExtensions.csproj" > "${RUNNER_TEMP}/release-project.csproj"
            python3 -c 'import sys; from pathlib import Path; sys.path.insert(0, ".github/scripts"); import sync_mcp_version as sync; actual = sync.current_version(Path(sys.argv[1])); expected = sys.argv[2]; sys.exit(f"Existing tag has version {actual}, expected {expected}") if actual != expected else None' "${RUNNER_TEMP}/release-project.csproj" "${PACKAGE_VERSION}"
          else
            git tag "${TAG}"
            git push origin "refs/tags/${TAG}"
          fi
          gh workflow run publish-nuget.yml --ref "${TAG}"

  publish:
    needs: check-version
    if: github.ref_type == 'tag' && needs.check-version.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    environment: nuget-publish
    env:
      PACKAGE_VERSION: ${{ needs.check-version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Check publishing credentials
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [[ -z "${NUGET_API_KEY}" ]]; then
            echo "::error::Configure NUGET_API_KEY in the nuget-publish environment."
            exit 1
          fi

      - name: Restore
        run: dotnet restore ./ModelContextProtocol.slnx

      - name: Build
        run: dotnet build ./ModelContextProtocol.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test ./ModelContextProtocol.slnx --configuration Release --no-build --no-restore

      - name: Pack
        run: |
          dotnet pack ./src/McpEndpointExtensions.csproj \
            --configuration Release \
            --no-build \
            --output ./artifacts

#      - name: Push package to nuget.org
#        env:
#          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
#        run: |
#          dotnet nuget push "artifacts/*.nupkg" \
#            --api-key "${NUGET_API_KEY}" \
#            --source "https://api.nuget.org/v3/index.json" \
#            --skip-duplicate
#          dotnet nuget push "artifacts/*.snupkg" \
#            --api-key "${NUGET_API_KEY}" \
#            --source "https://api.nuget.org/v3/index.json" \
#            --skip-duplicate

      # Get a short-lived NuGet API key
      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
          
      # Push the package
      - name: NuGet push
        run: dotnet nuget push artifacts/my-sdk.nupkg --api-key ${{steps.login.outputs.NUGET_API_KEY}} --source https://api.nuget.org/v3/index.json
